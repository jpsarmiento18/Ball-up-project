<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BallUp</title>
  <link rel="stylesheet" href="home.css" />
  <script type="module" src="home.js" defer></script>
  <script type="module" src="players.js" defer></script>
  <script type="module" src="teams.js" defer></script>
</head>

<body>
  <header>
    <a href="#" class="brand">
      <img src="img/slamdunk.svg" alt="BallUp logo" width="32" height="32" />
      BallUp
    </a>
    <input type="search" id="search" placeholder="Search a player/team..." />
  </header>

  <aside>
    <nav>
      <a href="/home.html" class="active">Home</a>
      <a href="/games.html">Games</a>
      <a href="/players.html">Players</a>
    </nav>
  </aside>

  <main>
    <section id="games">
      <h2 id="live-games">Live Games</h2>
      <ul id="games-list"></ul>
    </section>

    <section id="players">
      <h2>Players</h2>
      <ul id="players-list"></ul>

      <div class="pagination">
        <button id="prev-btn">Previous</button>
        <span id="page-label">Page 1</span>
        <button id="next-btn">Next</button>
      </div>
    </section>

    <section id="teams">
      <h2>Teams</h2>
      <p id="conference-label"></p>
      <ul id="teams-list"></ul>
      
      <div class="conference-tabs">
        <button id="east-btn" class="active">East</button>
        <button id="west-btn">West</button>
      </div>
      
    </section>
  </main>
</body>

</html>
